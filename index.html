<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2.5D Isometric Prototype</title>
    <link rel="stylesheet" href="main-styles.css">
</head>
<body>
    <div id="controls">
        <div class="control-row">
            <span class="label-text">Size (<span id="size-val">82</span>):</span>
            <input type="range" id="tile-size" min="32" max="128" value="82">
            <button class="btn-step" id="btn-ts-down">◀</button>
            <button class="btn-step" id="btn-ts-up">▶</button>
        </div>
        <div class="control-row">
            <span class="label-text">Pitch (<span id="pitch-val">20</span>°):</span>
            <input type="range" id="camera-pitch" min="0" max="90" step="10" value="20">
            <button class="btn-step" id="btn-p-down">◀</button>
            <button class="btn-step" id="btn-p-up">▶</button>
        </div>
        <div class="control-row">
            <span class="label-text">Wall Ht (<span id="wall-val">2.0</span>):</span>
            <input type="range" id="wall-height" min="0.5" max="5.0" step="0.1" value="2.0">
            <button class="btn-step" id="btn-wh-down">◀</button>
            <button class="btn-step" id="btn-wh-up">▶</button>
        </div>
        <div class="control-row">
            <span class="label-text">Obs Ht (<span id="obs-val">1.5</span>):</span>
            <input type="range" id="obs-height" min="0.5" max="5.0" step="0.1" value="1.5">
            <button class="btn-step" id="btn-oh-down">◀</button>
            <button class="btn-step" id="btn-oh-up">▶</button>
        </div>
        <div class="control-row">
            <span class="label-text">Zoom (<span id="zoom-val">1.4</span>):</span>
            <input type="range" id="zoom" min="0.5" max="3.0" step="0.1" value="1.4">
            <button class="btn-step" id="btn-z-down">◀</button>
            <button class="btn-step" id="btn-z-up">▶</button>
        </div>
        <div class="control-row">
            <span class="label-text">Rotate (<span id="rot-val">0</span>°):</span>
            <input type="range" id="rotation" min="0" max="270" step="90" value="0">
            <button class="btn-step" id="btn-r-down">◀</button>
            <button class="btn-step" id="btn-r-up">▶</button>
        </div>
        <div class="button-row">
            <button id="btn-undo">Undo Change</button>
            <button id="btn-export">Export Settings</button>
        </div>
		<button id="btn-combine" style="display:none; background-color: #00aa44;">Combine Walls</button>        <textarea id="export-out" readonly rows="4" style="display:none;"></textarea>
    </div>
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <script src="game-script.js"></script>
	<script src="design-controls.js"></script>
</body>
</html>
